name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, testar e empacotar
        run: ./mvnw -B verify

      - name: Guardar o WAR
        uses: actions/upload-artifact@v4
        with:
          name: cantinaif-war
          path: target/*.war
          if-no-files-found: error
