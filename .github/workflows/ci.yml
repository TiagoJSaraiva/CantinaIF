name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, testar e empacotar
        run: ./mvnw -B verify

      - name: Guardar o WAR
        uses: actions/upload-artifact@v4
        with:
          name: cantinaif-war
          path: target/*.war
          if-no-files-found: error

  docker:
    name: imagem Docker (fumaca)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build --build-arg RENDER_GIT_COMMIT=${{ github.sha }} -t cantinaif .

      - name: Subir atras de proxy HTTPS simulado
        run: |
          docker run -d --name cantinaif --memory=512m -p 18080:10000 \
            -e PORT=10000 -e CANTINA_BEHIND_PROXY=true -e CANTINA_COOKIE_SECURE=true cantinaif
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health)" = "200" ] && exit 0
            sleep 2
          done
          docker logs cantinaif
          exit 1

      - name: Verificacoes de fumaca (health, cookie Secure, cabecalhos)
        run: sh tools/smoke-proxy.sh http://127.0.0.1:18080 trusted

      - name: Usuario nao-root
        run: test "$(docker exec cantinaif id -u)" != "0"

      - name: Commit da imagem no /health
        run: sh tools/check-render-deploy.sh http://127.0.0.1:18080 ${{ github.sha }} 0

      - name: Logs do contêiner (em caso de falha)
        if: failure()
        run: docker logs cantinaif

  render:
    name: deploy no Render
    runs-on: ubuntu-latest
    # o Render faz o deploy sozinho a cada push na main; este job so confere se o commit chegou ao ar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # um push mais novo substitui o deploy em andamento, entao a checagem anterior e cancelada
    concurrency:
      group: render-deploy
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Esperar o Render servir este commit
        run: sh tools/check-render-deploy.sh https://cantinaif-ubt0.onrender.com ${{ github.sha }} 900
